[project]
name = "celery-cloud"
version = "0.1.0"
description = "Celery workers in the cloud"
authors = [
    {name = "Linus", email = "impalah@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["celery", "cloud", "workers"]
requires-python = ">=3.12"

dependencies = [
    "celery[dynamodb,sqs]>=5.4.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
]

[project.scripts]
celery-worker = "celery_cloud.worker:main"
celery-test = "celery_cloud:celery"
celery-cloud = "celery_cloud.main:main"
celery-cloud-hello = "celery_cloud:hello"
celery-lambda = "celery_cloud.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "debugpy>=1.8.13",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
]
