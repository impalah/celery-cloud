[project]
name = "celery-cloud"
version = "0.1.0"
description = "Celery workers in the cloud"
authors = [
    {name = "Linus", email = "impalah@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["celery", "cloud", "workers"]
requires-python = ">=3.12"

dependencies = [
    "celery[dynamodb,sqs]>=5.4.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pynamodb>=6.0.2",
    "python-dotenv>=1.0.1",
    "svix-ksuid>=0.6.2",
]

[project.scripts]
celery-worker = "celery_cloud.celery.worker:main"
celery-cloud = "celery_cloud.celery.main:main"
celery-cloud-hello = "celery_cloud.client:hello"
celery-client = "celery_cloud.client:celery"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "debugpy>=1.8.13",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
]
