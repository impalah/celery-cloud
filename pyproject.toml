[project]
name = "celery-cloud"
version = "0.2.0"
description = "Celery workers in the cloud"
authors = [
    {name = "Linus", email = "impalah@gmail.com"}
]
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
keywords = ["celery", "cloud", "workers", "aws"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: Celery",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.12"

dependencies = [
    "boto3>=1.44.4",
    "loguru>=0.8.0",
    "pybreaker>=1.4.1",
    "pydantic>=2.14.3",
    "pynamodb>=6.1.0",
    "python-dotenv>=1.2.4",
    "svix-ksuid>=0.7.0",
    "tenacity>=9.2.1",
]

[project.urls]
Repository = "https://github.com/impalah/celery-cloud"
Issues = "https://github.com/impalah/celery-cloud/issues"

# [project.scripts]
# celery-client = "celery_cloud.client:celery"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# Serializers other than JSON (the runner image needs the extra for the one you use)
msgpack = ["msgpack>=1.1.0"]
yaml = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "debugpy>=1.8.22",
    "fastapi>=0.163.1",
    "ipykernel>=7.4.0",
    "moto[dynamodb,sqs]>=5.2.5",
    "msgpack>=1.1.0",
    "pyyaml>=6.0.2",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
    "uvicorn>=0.54.0",
]
# Sphinx site (pages_source -> docs): `make docs`
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=1.0.0",
]

[tool.ruff]
line-length = 88
src = ["src"]  # First, add the source code folder
target-version = "py312"  # We are using Python 3.12

[tool.ruff.lint]
# Activate additional rules to imitate flake8 and isort
select = [
  "E", "F", "I", "UP", "B", "W", "C90"
]
# Exclude files and folders that are not part of the source code
exclude = ["tests/data", ".venv"]

# Activate autofix for common problems
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
pretty = true




[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

# Mutation testing (manual, NOT part of the regular CI): `make mutation`
[tool.mutmut]
# the whole package is copied (mutmut needs the __init__.py files)...
source_paths = ["src/celery_cloud"]
# ...but only the critical modules are mutated
only_mutate = [
    "src/celery_cloud/settings.py",
    "src/celery_cloud/entities/sqs_entities.py",
    "src/celery_cloud/entities/task.py",
    "src/celery_cloud/models/task_model.py",
    "src/celery_cloud/runners/aws_lambda.py",
    "src/celery_cloud/runners/lambda_strategy.py",
    "src/celery_cloud/runners/local_strategy.py",
    "src/celery_cloud/runners/task_executor.py",
    "src/celery_cloud/runners/canvas.py",
    "src/celery_cloud/runners/builtin_tasks.py",
    "src/celery_cloud/models/canvas_model.py",
    "src/celery_cloud/tasks.py",
    "src/celery_cloud/messaging.py",
    "src/celery_cloud/deadline.py",
    "src/celery_cloud/serialization.py",
    "src/celery_cloud/client.py",
]
# the docs examples are tested too (tests/integration/test_docs_examples.py)
also_copy = ["pages_source/examples"]
pytest_add_cli_args_test_selection = ["tests/"]
# the package lives under src/, mutmut runs the tests inside its mutants/ copy
pytest_add_cli_args = ["-o", "pythonpath=src", "-p", "no:cacheprovider"]
