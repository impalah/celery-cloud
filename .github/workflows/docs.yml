name: documentation

# Builds the Sphinx site (pages_source -> docs/) and commits the HTML, which GitHub
# Pages publishes from the docs/ folder of main. Warnings are errors: a broken
# reference or a docstring problem stops the build instead of being published.
on:
  push:
    branches:
      - main
    paths:
      - "pages_source/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

# One build at a time, and never cancel a run that is about to commit
concurrency:
  group: documentation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project and the documentation tools
        run: uv sync --group docs

      - name: Build documentation
        run: |
          rm -rf docs
          uv run sphinx-build -W --keep-going -d pages_source/_build/.doctrees pages_source docs

      - name: Commit and push documentation
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add --all docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update documentation"
            # main may have moved while the site was building
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
