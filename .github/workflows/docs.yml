name: documentation

# Builds the Sphinx site (pages_source -> docs/) and commits the HTML, which GitHub
# Pages publishes from the docs/ folder of main. Warnings are errors: a broken
# reference or a docstring problem stops the build instead of being published.
on:
  push:
    branches:
      - main
    paths:
      - "pages_source/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

# One build at a time, and never cancel a run that is about to commit
concurrency:
  group: documentation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project and the documentation tools
        run: uv sync --group docs

      - name: Build documentation
        run: |
          rm -rf docs
          uv run sphinx-build -W --keep-going -d pages_source/_build/.doctrees pages_source docs

      - name: Commit and push documentation
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add --all docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update documentation"
            # main may have moved while the site was building
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
